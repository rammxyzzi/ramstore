<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Akun Garena Free Fire</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 text-gray-800 font-sans max-w-md mx-auto min-h-screen">

  <!-- Header -->
  <div class="sticky top-0 bg-white z-20 px-4 py-3 flex items-center gap-3 border-b border-gray-100">
    <a href="index.html" class="text-gray-600 text-lg"><i class="fa-solid fa-arrow-left"></i></a>
    <div class="flex-1 relative">
      <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
      <input type="text" placeholder="Search" class="w-full bg-white border border-amber-400 rounded-lg py-1.5 pl-9 pr-3 text-sm focus:outline-none">
    </div>
    <button class="text-gray-600 text-lg"><i class="fa-regular fa-house"></i></button>
    <button class="text-gray-600 text-lg"><i class="fa-solid fa-cart-shopping"></i></button>
  </div>

  <!-- Title & Tabs -->
  <div class="bg-white">
    <div class="px-4 py-3 flex items-center gap-3">
      <div class="w-12 h-12 rounded-xl bg-orange-100 overflow-hidden shrink-0 flex items-center justify-center">
        <i class="fa-solid fa-fire text-orange-500 text-2xl"></i>
      </div>
      <h1 class="font-bold text-gray-900 text-lg">Jual Akun FF</h1>
    </div>
    <div class="flex border-b border-gray-200 px-2 overflow-x-auto text-sm font-semibold scrollbar-hide">
      <button class="px-4 py-2.5 text-gray-500">Semua</button>
      <button class="px-4 py-2.5 text-gray-500">Top Up</button>
      <button class="px-4 py-2.5 text-blue-600 border-b-2 border-blue-600">Akun</button>
      <button class="px-4 py-2.5 text-gray-500">Item</button>
      <button class="px-4 py-2.5 text-gray-500">Voucher</button>
    </div>
  </div>

  <div class="p-4">
    <p class="text-xs text-gray-600 font-medium mb-3">Hasil pencarian ditemukan: <span class="font-bold" id="total-produk">...</span> produk</p>
    
    <!-- Wadah Produk Realtime -->
    <div id="product-container" class="grid grid-cols-2 gap-3">
      <!-- Loading State -->
      <p class="text-sm text-gray-500 col-span-2 text-center py-5">Memuat data realtime...</p>
    </div>
  </div>

  <script type="module" src="/id/freefire/app.js"></script>
</body>
</html>
